<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيصل للسبوع والمناسبات - طنطا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fffaf7}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #fde68a;display:flex;justify-content:space-between;align-items:center;padding:12px 4%}
.logo{font-weight:800;font-size:18px;color:#7c2d12}
.shipping{background:#7c2d12;color:#fff;text-align:center;padding:7px;font-weight:700;font-size:12px}
.cart-btn{position:relative;background:#7c2d12;color:#fff;border:none;padding:9px 18px;border-radius:30px;font-weight:800;cursor:pointer}
#cart-count{position:absolute;top:-6px;left:-6px;background:red;color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.cats{display:flex;gap:7px;padding:12px 4%;overflow-x:auto;white-space:nowrap;background:#fffaf7;border-bottom:1px solid #fde68a}
.cat{padding:8px 16px;border-radius:30px;border:1.5px solid #fed7aa;background:#fff;font-weight:700;font-size:12px;cursor:pointer}
.cat.active{background:#7c2d12;color:#fff;border-color:#7c2d12}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;padding:15px 4%}
.empty{text-align:center;padding:60px 20px;color:#999}
#cart-drawer{position:fixed;top:0;left:-100%;width:88%;max-width:360px;height:100%;background:#fff;z-index:300;transition:0.3s;padding:18px;display:flex;flex-direction:column}
#cart-drawer.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:250}
.overlay.show{display:block}
footer{background:#431407;color:#ffedd5;padding:25px 5%;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<header><div class="logo">فيصل <span>للسبوع والمناسبات</span></div><button class="cart-btn" onclick="openCart()">السلة <span id="cart-count">0</span></button></header>
<div class="shipping">شحن داخل طنطا وجميع المحافظات - واتساب 01120718172</div>
<div class="cats">
<button class="cat active">الكل</button>
<button class="cat">علب السبوع</button>
<button class="cat">ديكور</button>
<button class="cat">لعب اطفال</button>
<button class="cat">شوكولاتة</button>
<button class="cat">اعياد ميلاد</button>
</div>
<div class="products" id="products"><div class="empty">جاري تجهيز المنتجات...<br>ابعت الصور والاسعار على الواتساب</div></div>
<div id="cart-drawer"><h3 style="color:#7c2d12">سلة الطلبات</h3><div id="cart-items" style="flex:1;overflow:auto;margin-top:12px"></div><div style="border-top:1px dashed #fed7aa;padding-top:10px"><button onclick="window.open('https://wa.me/201120718172','_blank')" style="width:100%;background:#25D366;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer">تواصل واتساب</button><button onclick="closeCart()" style="width:100%;margin-top:7px;background:#fff7ed;border:1px solid #fed7aa;padding:8px;border-radius:8px;cursor:pointer">اغلاق</button></div></div>
<footer><h3>فيصل للسبوع والمناسبات - طنطا</h3><p>واتساب: 01120718172</p></footer>
<script>
function openCart(){document.getElementById('cart-drawer').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeCart(){document.getElementById('cart-drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
</script>
</body>
</html>
