<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div class="logo">فيصل <span>للسبوع والمناسبات</span></div>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fffaf7;color:#222}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #fde68a;display:flex;justify-content:space-between;align-items:center;padding:12px 4%}
.logo{font-weight:800;font-size:20px;color:#7c2d12}.logo span{color:#ea580c}
.cart-btn{position:relative;background:#7c2d12;color:#fff;border:none;padding:10px 22px;border-radius:30px;font-weight:800;cursor:pointer}
#cart-count{position:absolute;top:-7px;left:-7px;background:#ec4899;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.hero{background:linear-gradient(135deg,#fff7ed,#ffedd5,#fef3c7);padding:35px 5%;text-align:center}
.hero h1{font-size:26px;color:#431407;line-height:1.4}.hero h1 b{color:#ea580c}
.hero p{color:#9a3412;margin-top:8px;font-size:14px}
.cats{display:flex;gap:8px;padding:14px 4%;overflow-x:auto;white-space:nowrap;scrollbar-width:none;position:sticky;top:57px;background:rgba(255,250,247,0.95);backdrop-filter:blur(8px);z-index:90;border-bottom:1px solid #f0e6df}
.cats::-webkit-scrollbar{display:none}
.cat{padding:10px 18px;border-radius:30px;border:1.5px solid #fed7aa;background:#fff;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.cat.active{background:#7c2d12;color:#fff;border-color:#7c2d12}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding:15px 4% 40px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(124,45,18,0.06);border:1px solid #fff1e6;transition:0.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(124,45,18,0.12)}
.card img{width:100%;height:150px;object-fit:cover;background:#fff7ed}
.card-body{padding:11px}
.badge{font-size:10px;background:#fff7ed;color:#c2410c;padding:2px 8px;border-radius:20px;font-weight:700;border:1px solid #fed7aa;display:inline-block;margin-bottom:5px}
.card-body h3{font-size:13px;line-height:1.3;height:36px;overflow:hidden;color:#431407}
.price{color:#ea580c;font-weight:800;font-size:15px;margin:5px 0}
.add-btn{width:100%;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:8px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}
.add-btn:hover{background:#7c2d12;color:#fff}
#cart-drawer{position:fixed;top:0;left:-100%;width:88%;max-width:380px;height:100%;background:#fff;z-index:300;box-shadow:15px 0 40px rgba(0,0,0,0.2);transition:0.3s;padding:20px;display:flex;flex-direction:column}
#cart-drawer.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(67,20,7,0.4);display:none;z-index:250}
.overlay.show{display:block}
footer{background:#431407;color:#ffedd5;padding:28px 5%;text-align:center}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<header><div class="logo">FAISAL <span>STORE</span></div><button class="cart-btn" onclick="openCart()">🛒 السلة <span id="cart-count">0</span></button></header>
<section class="hero"><h1>كل احتياجات <b>السبوع واعياد الميلاد</b> من مكان واحد</h1><p>طنطا - الغربية | توصيل لجميع المحافظات - جملة وقطاعي</p></section>
<div class="cats">
<button class="cat active" onclick="filterCat('all',this)">✨ الكل</button>
<button class="cat" onclick="filterCat('علب السبوع',this)">📦 علب السبوع</button>
<button class="cat" onclick="filterCat('ديكور',this)">🎀 ديكور</button>
<button class="cat" onclick="filterCat('لعب اطفال',this)">🧸 لعب أطفال</button>
<button class="cat" onclick="filterCat('شوكولاتة',this)">🍫 شوكولاتة</button>
<button class="cat" onclick="filterCat('اعياد ميلاد',this)">🎂 أعياد ميلاد</button>
</div>
<div class="products" id="products"></div>
<div id="cart-drawer">
<h3 style="color:#7c2d12">سلة الطلبات 🛒</h3>
<div id="cart-items" style="flex:1;overflow:auto;margin-top:15px"></div>
<div style="border-top:2px dashed #fed7aa;padding-top:12px">
<div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px"><span>الإجمالي:</span><span id="total" style="color:#ea580c">0 جنيه</span></div>
<button onclick="checkout()" style="width:100%;background:#25D366;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;margin-top:12px;cursor:pointer;font-size:15px">إتمام الطلب واتساب ✅</button>
<button onclick="closeCart()" style="width:100%;margin-top:8px;background:#fff7ed;border:1px solid #fed7aa;padding:9px;border-radius:10px;cursor:pointer">متابعة التسوق</button>
</div>
</div>
<footer><h3>FAISAL STORE - طنطا</h3><p style="color:#fed7aa;margin-top:6px">متخصصون في علب السبوع - ديكور - لعب اطفال - شوكولاتة - اعياد ميلاد</p><p style="font-size:12px;margin-top:8px">📍 طنطا - الغربية</p></footer>
<script>
const WHATSAPP="201000000000";
const products=[
{id:1,name:"علبة سبوع كرتون - 50 قطعة الوان",price:300,cat:"علب السبوع",img:"https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=400"},
{id:2,name:"علبة سبوع قطيفة فاخرة - 30 قطعة",price:550,cat:"علب السبوع",img:"https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=400"},
{id:3,name:"علبة سبوع شفافة اكريليك",price:25,cat:"علب السبوع",img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=400"},
{id:4,name:"ديكور سبوع ولد - ازرق وابيض",price:450,cat:"ديكور",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
{id:5,name:"ديكور سبوع بنت - روز جولد كامل",price:480,cat:"ديكور",img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=400"},
{id:6,name:"ستارة اسم البيبي + بلالين هيليوم",price:320,cat:"ديكور",img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=400"},
{id:7,name:"طقم لعب اطفال سبوع 7 قطع",price:120,cat:"لعب اطفال",img:"https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400"},
{id:8,name:"شخشيخة وعضاضة سيليكون",price:65,cat:"لعب اطفال",img:"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=400"},
{id:9,name:"ببرونة + لهاية - طقم سبوع",price:95,cat:"لعب اطفال",img:"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=400"},
{id:10,name:"شوكولاتة سبوع بالاسم - 100 قطعة",price:400,cat:"شوكولاتة",img:"https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=400"},
{id:11,name:"شوكولاتة محشية - علبة فاخرة",price:180,cat:"شوكولاتة",img:"https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=400"},
{id:12,name:"طقم عيد ميلاد كامل - 10 افراد",price:250,cat:"اعياد ميلاد",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
{id:13,name:"زينة عيد ميلاد - Happy Birthday",price:120,cat:"اعياد ميلاد",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
{id:14,name:"شموع عيد ميلاد ارقام + تورتة",price:85,cat:"اعياد ميلاد",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
{id:15,name:"كروت سبوع + توزيعات جاهزة",price:15,cat:"علب السبوع",img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=400"},
];
let cart=[];
function render(list){document.getElementById('products').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}" loading="lazy"><div class="card-body"><span class="badge">${p.cat}</span><h3>${p.name}</h3><div class="price">${p.price} جنيه</div><button class="add-btn" onclick="addToCart(${p.id})">+ أضف للسلة</button></div></div>`).join('');}
render(products);
function filterCat(c,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(c==='all')render(products);else render(products.filter(p=>p.cat===c));}
function addToCart(id){let p=products.find(x=>x.id===id);let ex=cart.find(x=>x.id===id);if(ex)ex.qty++;else cart.push({...p,qty:1});update();openCart();}
function update(){document.getElementById('cart-count').innerText=cart.reduce((s,i)=>s+i.qty,0);let d=document.getElementById('cart-items');if(!cart.length)d.innerHTML="<p style='text-align:center;color:#888;margin-top:30px'>السلة فاضية</p>";else d.innerHTML=cart.map(i=>`<div style='display:flex;gap:10px;margin-bottom:12px;border-bottom:1px solid #ffedd5;padding-bottom:10px'><img src='${i.img}' style='width:55px;height:55px;border-radius:10px;object-fit:cover'><div style='flex:1'><div style='font-size:12px;font-weight:700;color:#431407'>${i.name}</div><div style='color:#ea580c;font-weight:800'>${i.price}ج x ${i.qty} = ${i.price*i.qty}ج</div><button onclick='removeItem(${i.id})' style='color:#dc2626;background:none;border:none;font-size:11px'>حذف</button></div></div>`).join('');document.getElementById('total').innerText=cart.reduce((s,i)=>s+i.price*i.qty,0)+" جنيه";}
function removeItem(id){cart=cart.filter(i=>i.id!==id);update();}
function openCart(){document.getElementById('cart-drawer').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeCart(){document.getElementById('cart-drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function checkout(){if(!cart.length){alert('السلة فاضية');return;}let msg="السلام عليكم Faisal Store%0Aعايز اطلب:%0A%0A";cart.forEach(i=>{msg+=`- ${i.name} (${i.qty}) = ${i.price*i.qty}ج%0A`;});msg+=`%0Aالإجمالي: ${cart.reduce((s,i)=>s+i.price*i.qty,0)} جنيه`;window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,"_blank");}
</script>
</body>
</html>
