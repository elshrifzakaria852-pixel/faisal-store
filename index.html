<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيصل للسبوع والمناسبات - طنطا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fffaf7}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #fde68a;display:flex;justify-content:space-between;align-items:center;padding:12px 4%}
.logo{font-weight:800;font-size:18px;color:#7c2d12}
.logo span{color:#ea580c}
.shipping{background:#7c2d12;color:#fff;text-align:center;padding:7px;font-weight:700;font-size:12px}
.cart-btn{position:relative;background:#7c2d12;color:#fff;border:none;padding:9px 18px;border-radius:30px;font-weight:800;cursor:pointer}
#cart-count{position:absolute;top:-6px;left:-6px;background:red;color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.cats{display:flex;gap:7px;padding:12px 4%;overflow-x:auto;white-space:nowrap;background:#fffaf7;border-bottom:1px solid #fde68a}
.cat{padding:8px 16px;border-radius:30px;border:1.5px solid #fed7aa;background:#fff;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}
.cat.active{background:#7c2d12;color:#fff;border-color:#7c2d12}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;padding:15px 4%}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,0.05);border:1px solid #fff1e6}
.card img{width:100%;height:140px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:12px;height:34px;overflow:hidden;color:#431407}
.price{color:#ea580c;font-weight:800;font-size:14px;margin:4px 0}
.add-btn{width:100%;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:7px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer}
#cart-drawer{position:fixed;top:0;left:-100%;width:88%;max-width:360px;height:100%;background:#fff;z-index:300;transition:0.3s;padding:18px;display:flex;flex-direction:column}
#cart-drawer.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:250}
.overlay.show{display:block}
footer{background:#431407;color:#ffedd5;padding:25px 5%;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<header><div class="logo">فيصل <span>للسبوع والمناسبات</span></div><button class="cart-btn" onclick="openCart()">السلة <span id="cart-count">0</span></button></header>
<div class="shipping">شحن داخل طنطا وجميع المحافظات - جملة وقطاعي - واتساب 01120718712</div>
<div class="cats">
<button class="cat active" onclick="filterCat('all',this)">الكل</button>
<button class="cat" onclick="filterCat('علب السبوع',this)">علب السبوع</button>
<button class="cat" onclick="filterCat('ديكور',this)">ديكور</button>
<button class="cat" onclick="filterCat('لعب اطفال',this)">لعب اطفال</button>
<button class="cat" onclick="filterCat('شوكولاتة',this)">شوكولاتة</button>
<button class="cat" onclick="filterCat('اعياد ميلاد',this)">اعياد ميلاد</button>
</div>
<div class="products" id="products"></div>
<div id="cart-drawer"><h3 style="color:#7c2d12">سلة الطلبات</h3><div id="cart-items" style="flex:1;overflow:auto;margin-top:12px"></div><div style="border-top:1px dashed #fed7aa;padding-top:10px"><div style="display:flex;justify-content:space-between;font-weight:800"><span>الاجمالي:</span><span id="total" style="color:#ea580c">0 جنيه</span></div><button onclick="checkout()" style="width:100%;background:#25D366;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer">اتمام الطلب واتساب</button><button onclick="closeCart()" style="width:100%;margin-top:7px;background:#fff7ed;border:1px solid #fed7aa;padding:8px;border-radius:8px;cursor:pointer">متابعة</button><p style="text-align:center;font-size:11px;margin-top:8px;color:#7c2d12;font-weight:700">شحن داخل طنطا وجميع المحافظات</p></div></div>
<footer><h3>فيصل للسبوع والمناسبات - طنطا</h3><p>شحن داخل طنطا وجميع المحافظات</p><p style="margin-top:6px">واتساب: 01120718712</p></footer>
<script>
const WHATSAPP="201120718712";
const products=[
{id:1,name:"علبة سبوع كرتون 50 قطعة",price:300,cat:"علب السبوع",img:"https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=400"},
{id:2,name:"علبة سبوع قطيفة فاخرة",price:550,cat:"علب السبوع",img:"https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=400"},
{id:3,name:"ديكور سبوع ولد كامل",price:450,cat:"ديكور",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
{id:4,name:"ديكور سبوع بنت روز جولد",price:480,cat:"ديكور",img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=400"},
{id:5,name:"طقم لعب اطفال سبوع",price:120,cat:"لعب اطفال",img:"https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400"},
{id:6,name:"شوكولاتة سبوع بالاسم",price:400,cat:"شوكولاتة",img:"https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=400"},
{id:7,name:"طقم عيد ميلاد 10 افراد",price:250,cat:"اعياد ميلاد",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
{id:8,name:"زينة عيد ميلاد",price:120,cat:"اعياد ميلاد",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400"},
];
let cart=[];
function render(list){document.getElementById('products').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><h3>${p.name}</h3><div class="price">${p.price} جنيه</div><button class="add-btn" onclick="addToCart(${p.id})">اضف للسلة</button></div></div>`).join('');}
render(products);
function filterCat(c,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(c==='all')render(products);else render(products.filter(p=>p.cat===c));}
function addToCart(id){let p=products.find(x=>x.id===id);let ex=cart.find(x=>x.id===id);if(ex)ex.qty++;else cart.push({...p,qty:1});update();openCart();}
function update(){document.getElementById('cart-count').innerText=cart.reduce((s,i)=>s+i.qty,0);let d=document.getElementById('cart-items');if(!cart.length)d.innerHTML="<p style='text-align:center;color:#888'>السلة فارغة</p>";else d.innerHTML=cart.map(i=>`<div style='display:flex;gap:8px;margin-bottom:10px;border-bottom:1px solid #ffedd5;padding-bottom:8px'><img src='${i.img}' style='width:50px;height:50px;border-radius:8px'><div style='flex:1'><div style='font-size:11px;font-weight:700'>${i.name}</div><div style='color:#ea580c;font-weight:800'>${i.price}ج x ${i.qty}</div><button onclick='removeItem(${i.id})' style='color:red;background:none;border:none;font-size:11px'>حذف</button></div></div>`).join('');document.getElementById('total').innerText=cart.reduce((s,i)=>s+i.price*i.qty,0)+" جنيه";}
function removeItem(id){cart=cart.filter(i=>i.id!==id);update();}
function openCart(){document.getElementById('cart-drawer').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeCart(){document.getElementById('cart-drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function checkout(){if(!cart.length){alert('السلة فارغة');return;}let msg="السلام عليكم فيصل للسبوع والمناسبات%0Aطلب جديد:%0A";cart.forEach(i=>{msg+=`- ${i.name} (${i.qty}) = ${i.price*i.qty}ج%0A`;});msg+=`%0Aالاجمالي: ${cart.reduce((s,i)=>s+i.price*i.qty,0)}ج%0Aشحن داخل طنطا وجميع المحافظات`;window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,"_blank");}
</script>
</body>
</html>
