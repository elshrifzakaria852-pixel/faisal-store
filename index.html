<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faisal Store</title><style>body{font-family:sans-serif;background:#fffaf7;padding:15px}header{display:flex;justify-content:space-between}button{padding:8px 12px;border-radius:10px;border:1px solid #fed7aa;cursor:pointer}.cat{margin:3px}.active{background:#7c2d12;color:#fff}.card{background:#fff;padding:10px;border-radius:10px;margin:5px 0;border:1px solid #eee}#drawer{position:fixed;top:0;left:-100%;width:80%;height:100%;background:#fff;padding:15px;transition:.3s;z-index:9}#drawer.open{left:0}.wa{position:fixed;bottom:15px;right:15px;background:#25D366;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:24px}</style></head><body>
<a class="wa" href="https://wa.me/201120718172">💬</a>
<header><b>FAISAL STORE</b><button onclick="openCart()">السلة <span id="c">0</span></button></header>
<div><button class="cat active" onclick="filter('all',this)">الكل</button><button class="cat" onclick="filter('علب السبوع',this)">علب السبوع</button><button class="cat" onclick="filter('ديكور',this)">ديكور</button><button class="cat" onclick="filter('لعب اطفال',this)">لعب اطفال</button></div>
<div id="products"></div>
<div id="drawer"><h3>السلة</h3><div id="items"></div><button onclick="checkout()" style="width:100%;background:#25D366;color:#fff;margin-top:10px">طلب واتساب</button><button onclick="closeCart()" style="width:100%;margin-top:5px">إغلاق</button></div>
<script>
const W="201120718172";const products=[{n:"علب سبوع",c:"علب السبوع"},{n:"ديكور ولد",c:"ديكور"},{n:"ديكور بنت",c:"ديكور"},{n:"لعب اطفال",c:"لعب اطفال"},{n:"شوكولاتة",c:"شوكولاتة"},{n:"عيد ميلاد",c:"اعياد ميلاد"}];let cart=[];
function render(l){document.getElementById('products').innerHTML=l.map((p,i)=>`<div class=card>${p.n}<button onclick="add(${products.indexOf(p)})" style="float:left">+</button></div>`).join('')}render(products);
function filter(k,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');k=='all'?render(products):render(products.filter(p=>p.c==k))}
function add(i){cart.push(products[i]);upd();openCart()}
function upd(){document.getElementById('c').innerText=cart.length;document.getElementById('items').innerHTML=cart.map((p,i)=>`${p.n} <a href=# onclick="cart.splice(${i},1);upd()">x</a><br>`).join('')}
function openCart(){document.getElementById('drawer').classList.add('open')}
function closeCart(){document.getElementById('drawer').classList.remove('open')}
function checkout(){if(!cart.length)return alert('فاضية');let m=cart.map(p=>"- "+p.n).join("%0A");open(`https://wa.me/${W}?text=طلب:%0A${m}`)}
</script></body></html>
