<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faisal Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fffaf7;padding:20px}
header{display:flex;justify-content:space-between;align-items:center}
.cart-btn{background:#7c2d12;color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer}
.cats{display:flex;gap:8px;margin:15px 0;overflow-x:auto}
.cat{padding:8px 15px;border-radius:20px;border:1px solid #fed7aa;background:#fff;cursor:pointer}
.cat.active{background:#7c2d12;color:#fff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;padding:12px;border-radius:12px;border:1px solid #ffedd5;text-align:center}
.add-btn{width:100%;margin-top:8px;background:#fff7ed;border:1px solid #fed7aa;padding:6px;border-radius:8px;cursor:pointer}
#drawer{position:fixed;top:0;left:-100%;width:85%;max-width:350px;height:100%;background:#fff;z-index:999;padding:15px;transition:0.3s;box-shadow:0 0 20px rgba(0,0,0,0.2)}
#drawer.open{left:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;z-index:998}
#overlay.show{display:block}
.wa-float{position:fixed;bottom:15px;right:15px;background:#25D366;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none}
</style>
</head>
<body>
<div id="overlay" onclick="closeCart()"></div>
<a href="https://wa.me/201120718172" class="wa-float" target="_blank">💬</a>
<header><h3>FAISAL STORE</h3><button class="cart-btn" onclick="openCart()">السلة <span id="count">0</span></button></header>
<div class="cats">
<button class="cat active" onclick="filterCat('all',this)">الكل</button>
<button class="cat" onclick="filterCat('علب السبوع',this)">علب السبوع</button>
<button class="cat" onclick="filterCat('ديكور',this)">ديكور</button>
<button class="cat" onclick="filterCat('لعب اطفال',this)">لعب اطفال</button>
<button class="cat" onclick="filterCat('شوكولاتة',this)">شوكولاتة</button>
<button class="cat" onclick="filterCat('اعياد ميلاد',this)">اعياد ميلاد</button>
</div>
<div class="products" id="products"></div>
<div id="drawer">
<h3>السلة 🛒</h3>
<div id="items" style="margin-top:10px"></div>
<button onclick="checkout()" style="width:100%;background:#25D366;color:#fff;border:none;padding:10px;border-radius:10px;margin-top:15px;font-weight:700">طلب واتساب</button>
<button onclick="closeCart()" style="width:100%;margin-top:8px;padding:8px;border-radius:10px;border:1px solid #fed7aa;background:#fff7ed">إغلاق</button>
</div>
<script>
const WHATSAPP="201120718172";
const products=[
{name:"علب سبوع كرتون",cat:"علب السبوع"},
{name:"علب سبوع قطيفة",cat:"علب السبوع"},
{name:"ديكور سبوع ولد",cat:"ديكور"},
{name:"ديكور سبوع بنت",cat:"ديكور"},
{name:"لعب اطفال سبوع",cat:"لعب اطفال"},
{name:"شخشيخة",cat:"لعب اطفال"},
{name:"شوكولاتة بالاسم",cat:"شوكولاتة"},
{name:"طقم عيد ميلاد",cat:"اعياد ميلاد"},
];
let cart=[];
function render(list){document.getElementById('products').innerHTML=list.map((p,i)=>`<div class="card"><div>${p.name}</div><button class="add-btn" onclick="addToCart(${products.indexOf(p)})">+ اضافة</button></div>`).join('')}
render(products);
function filterCat(c,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(c=='all')render(products);else render(products.filter(p=>p.cat==c))}
function addToCart(i){cart.push(products[i]);update();openCart()}
function update(){document.getElementById('count').innerText=cart.length;document.getElementById('items').innerHTML=cart.map((p,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0"><span>${p.name}</span><button onclick="cart.splice(${i},1);update()" style="color:red;border:none;background:none">x</button></div>`).join('')}
function openCart(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeCart(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function checkout(){if(!cart.length){alert('السلة فاضية');return}let msg="السلام عليكم عايز اطلب:%0A"+cart.map(p=>"- "+p.name).join("%0A");window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,"_blank")}
</script>
</body>
  </html>
