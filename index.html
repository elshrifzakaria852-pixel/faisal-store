*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#fffaf7;color:#222}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #f0e6df;display:flex;justify-content:space-between;align-items:center;padding:12px 4%}
.logo{font-weight:800;font-size:20px;color:#7c2d12} .logo span{color:#ea580c}
.cart-btn{position:relative;background:#7c2d12;color:#fff;border:none;padding:10px 20px;border-radius:30px;font-weight:800;cursor:pointer}
#cart-count{position:absolute;top:-7px;left:-7px;background:#ec4899;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.hero{background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 40%,#fef3c7 100%);padding:35px 5%;text-align:center;border-bottom:1px solid #fde68a}
.hero h1{font-size:28px;line-height:1.3;color:#431407} .hero h1 b{color:#ea580c}
.hero p{color:#9a3412;margin-top:8px;font-size:14px}
.cats{display:flex;gap:8px;padding:14px 4%;overflow-x:auto;white-space:nowrap;scrollbar-width:none;position:sticky;top:58px;background:rgba(255,250,247,0.95);backdrop-filter:blur(8px);z-index:90;border-bottom:1px solid #f0e6df}
.cats::-webkit-scrollbar{display:none}
.cat{padding:9px 16px;border-radius:30px;border:1.5px solid #fed7aa;background:#fff;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.cat.active{background:#7c2d12;color:#fff;border-color:#7c2d12}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding:15px 4% 40px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(124,45,18,0.06);border:1px solid #fff1e6;transition:0.2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:145px;object-fit:cover;background:#fff7ed}
.card-body{padding:10px}
.badge{font-size:10px;background:#fff7ed;color:#c2410c;padding:2px 8px;border-radius:20px;font-weight:700;border:1px solid #fed7aa;display:inline-block;margin-bottom:4px}
.card-body h3{font-size:13px;line-height:1.3;height:36px;overflow:hidden;color:#431407}
.price{color:#ea580c;font-weight:800;font-size:15px;margin:4px 0}
.add-btn{width:100%;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:8px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}
.add-btn:hover{background:#7c2d12;color:#fff;border-color:#7c2d12}
#cart-drawer{position:fixed;top:0;left:-100%;width:88%;max-width:380px;height:100%;background:#fff;z-index:300;box-shadow:15px 0 40px rgba(0,0,0,0.2);transition:0.3s;padding:20px;display:flex;flex-direction:column}
#cart-drawer.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(67,20,7,0.4);display:none;z-index:250}
.overlay.show{display:block}
